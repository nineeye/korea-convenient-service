name: AFO C0168 DotNet Offline Host Native Publish v2
on:
  push:
    branches: [afo-c0168-native-adapter-smoke-20261009]
    paths: [.github/workflows/afo-c0168-dotnet-v2.yml]
permissions:
  contents: read
jobs:
  dotnet-sdk:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - name: Offline restore with RID + publish including DLL runtimeconfig
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet new console -n dotnet-smoke -f net8.0 --no-restore
          if ($LASTEXITCODE -ne 0) {throw 'DOTNET_NEW_FAIL'}
          New-Item -ItemType Directory -Force empty-feed | Out-Null
          dotnet restore dotnet-smoke/dotnet-smoke.csproj --source "$PWD\empty-feed" --disable-parallel
          if ($LASTEXITCODE -ne 0) {throw 'DOTNET_OFFLINE_RESTORE_RID_FAIL'}
          dotnet publish dotnet-smoke/dotnet-smoke.csproj -c Release --self-contained false --no-restore -o "$PWD\publish"
          if ($LASTEXITCODE -ne 0) {throw 'DOTNET_OFFLINE_PUBLISH_FAIL'}
          & .\publish\dotnet-smoke.exe
          if ($LASTEXITCODE -ne 0) {throw 'DOTNET_RUN_FAIL'}
          foreach ($file in @('dotnet-smoke.exe','dotnet-smoke.dll','dotnet-smoke.runtimeconfig.json','dotnet-smoke.deps.json')) {
            if (!(Test-Path ("publish\"+$file))) {throw ("DOTNET_SIDECAR_MISSING_"+$file)}
          }
          $sha=(Get-FileHash publish/dotnet-smoke.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{family='dotnet';host='windows-2022-x64-without-explicit-rid';real_windows_build='PASS';windows_execution='PASS';sha256=$sha;sidecars='PASS';run_id=$env:GITHUB_RUN_ID;customer_final='NOT_APPROVED'} | ConvertTo-Json | Set-Content dotnet-proof.json
          Write-Host ('DOTNET_OFFLINE_RID_BUILD_AND_RUN_PASS '+$sha)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: C0168_REAL_DOTNET_SDK
          path: |
            publish/dotnet-smoke.exe
            publish/dotnet-smoke.dll
            publish/dotnet-smoke.runtimeconfig.json
            publish/dotnet-smoke.deps.json
            dotnet-proof.json
          retention-days: 2
