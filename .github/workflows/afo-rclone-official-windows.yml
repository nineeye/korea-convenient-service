name: AFO rclone official Windows EXE real build (public free runner)

on:
  push:
    branches:
      - afo-rclone-free-build-20261009
    paths:
      - .github/workflows/afo-rclone-official-windows.yml

permissions:
  contents: read

concurrency:
  group: afo-rclone-free-20261009
  cancel-in-progress: false

jobs:
  windows-real-rclone:
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      RCLONE_COMMIT: 408cc55171b67d836c647fd11a3b2df2a64b050a
      RCLONE_TREE: 5d5248ae6b84d5f23304fb53a00e47db747f28e8
      GIT_TERMINAL_PROMPT: '0'
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOENV: 'off'
      CGO_ENABLED: '0'
    steps:
      - name: Download the exact public official rclone source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rclone/rclone
          ref: 408cc55171b67d836c647fd11a3b2df2a64b050a
          path: upstream
          persist-credentials: false
          fetch-depth: 1

      - name: Verify upstream Git commit and tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location upstream
          $commit = (& git rev-parse HEAD).Trim()
          $tree = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -ne $env:RCLONE_COMMIT -or $tree -ne $env:RCLONE_TREE) { throw 'OFFICIAL_SOURCE_PIN_MISMATCH' }
          Write-Host "PINNED_SOURCE_PASS $commit $tree"

      - name: Install official Go version from upstream go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: upstream/go.mod
          cache: false

      - name: Compile entire official rclone source to Windows EXE and actually execute it
        shell: pwsh
        working-directory: upstream
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          & go version
          if ($LASTEXITCODE -ne 0) { throw 'GO_VERSION_FAILED' }
          & go build -trimpath -mod=readonly -o dist/rclone.exe .
          if ($LASTEXITCODE -ne 0) { throw "REAL_RCLONE_COMPILATION_FAILED:$LASTEXITCODE" }
          & .\dist\rclone.exe version | Tee-Object -FilePath .\dist\rclone-version.txt
          if ($LASTEXITCODE -ne 0) { throw "WINDOWS_EXECUTION_FAILED:$LASTEXITCODE" }
          $first = Get-Content -LiteralPath .\dist\rclone-version.txt -TotalCount 1
          if ($first -notmatch '^rclone v1\.76\.0') { throw "WRONG_RCLONE_VERSION:$first" }
          $bin = (Resolve-Path .\dist\rclone.exe).Path
          $bytes = [IO.File]::ReadAllBytes($bin)
          if ($bytes.Length -lt 1024 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'EXE_MZ_INVALID' }
          $pe = [BitConverter]::ToInt32($bytes,0x3c)
          if ($pe -lt 64 -or $pe+26 -gt $bytes.Length -or [BitConverter]::ToUInt16($bytes,$pe+4) -ne 0x8664 -or [BitConverter]::ToUInt16($bytes,$pe+24) -ne 0x20b) { throw 'EXE_PE32_PLUS_AMD64_INVALID' }
          $sha = (Get-FileHash -LiteralPath $bin -Algorithm SHA256).Hash.ToLowerInvariant()
          $dirty = & git diff --name-only
          if ($LASTEXITCODE -ne 0 -or @($dirty).Count -gt 0) { throw 'UPSTREAM_TRACKED_FILES_CHANGED' }
          $proof = [ordered]@{
            kind = 'AFO_RCLONE_REAL_WINDOWS_BUILD_PROOF'
            commit = $env:RCLONE_COMMIT
            tree = $env:RCLONE_TREE
            version = $first
            windows_execution = 'PASS'
            exe_sha256 = $sha
            exe_bytes = $bytes.Length
            go_version = (& go version | Out-String).Trim()
            final_factory_certification = 'PENDING_INDEPENDENT_REVIEW'
            runner_os = $env:RUNNER_OS
            github_run_id = $env:GITHUB_RUN_ID
          }
          $proof | ConvertTo-Json | Set-Content -LiteralPath dist\AFO_WINDOWS_PROOF.json -Encoding utf8
          Write-Host ('REAL_RCLONE_EXE_COMPILED_EXECUTED_SHA256=' + $sha)
          Get-Content dist\AFO_WINDOWS_PROOF.json

      - name: Save EXE and verifiable results
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AFO_OFFICIAL_RCLONE_WINDOWS_X64
          path: |
            upstream/dist/rclone.exe
            upstream/dist/rclone-version.txt
            upstream/dist/AFO_WINDOWS_PROOF.json
          retention-days: 1
          if-no-files-found: error
