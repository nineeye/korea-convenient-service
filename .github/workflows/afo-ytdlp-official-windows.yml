name: AFO yt-dlp official Windows EXE public test
on:
  push:
    branches: [afo-rclone-free-build-20261009]
    paths: [.github/workflows/afo-ytdlp-official-windows.yml]
permissions:
  contents: read
jobs:
  yt-dlp:
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - name: Official pinned yt-dlp source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: yt-dlp/yt-dlp
          ref: 51bab8a0116f4d8004c315706d809782607d5847
          fetch-depth: 1
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Real package build
        shell: pwsh
        working-directory: upstream
        run: |
          $ErrorActionPreference='Stop'
          $sha=(& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -ne '51bab8a0116f4d8004c315706d809782607d5847') { throw 'SOURCE_PIN_MISMATCH' }
          python devscripts/install_deps.py --include-group pyinstaller
          if ($LASTEXITCODE -ne 0) { throw 'DEPS_FAIL' }
          python devscripts/make_lazy_extractors.py
          if ($LASTEXITCODE -ne 0) { throw 'EXTRACTOR_GENERATION_FAIL' }
          python bundle/pyinstaller.py
          if ($LASTEXITCODE -ne 0) { throw 'PYINSTALLER_FAIL' }
          $exe=(Resolve-Path dist/yt-dlp.exe).Path
          & $exe --version | Tee-Object -FilePath dist/yt-dlp-version.txt
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_EXECUTION_FAILED' }
          $bytes=[IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'INVALID_EXE' }
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{kind='AFO_YTDLP_REAL_WINDOWS_BUILD_PROOF';sha=$hash;bytes=$bytes.Length;commit=$sha;version=(Get-Content dist/yt-dlp-version.txt -TotalCount 1);windows_execution='PASS';runner_os=$env:RUNNER_OS;github_run_id=$env:GITHUB_RUN_ID;factory_final='NOT_APPROVED'} | ConvertTo-Json | Set-Content dist/AFO_YTDLP_PROOF.json
          Write-Host ('YTDLP_REAL_WINDOWS_PASS_SHA256=' + $hash)
      - name: Preserve real result
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AFO_OFFICIAL_YTDLP_WINDOWS_X64
          path: |
            upstream/dist/yt-dlp.exe
            upstream/dist/yt-dlp-version.txt
            upstream/dist/AFO_YTDLP_PROOF.json
          retention-days: 1
